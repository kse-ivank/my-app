name: Main Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-build-push:
    needs: build-and-test
    uses: kse-ivank/kse-labs-trusted-workflows/.github/workflows/docker-build.yaml@main
    with:
      image-name: my-app
      context: .
      dockerfile: Dockerfile
      push: true
      tags: "${{ github.sha }},latest"
    permissions:
      contents: read
      packages: write

  secret-scan:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull secret scanner image
        run: docker pull ghcr.io/${{ github.repository_owner }}/custom-secret-detect:latest

      - name: Run secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/scan" \
            ghcr.io/${{ github.repository_owner }}/custom-secret-detect:latest \
            /scan/

  update-deployment:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/kse-labs-deployment
          token: ${{ secrets.DEPLOYMENT_PAT }}

      - name: Update image tag
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" \
            applications/my-app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications/my-app/deployment.yaml
          git diff --cached --quiet || \
            (git commit -m "deploy: my-app ${{ github.sha }}" && git push)
